name: FinControl 1.0 - instalador Windows
on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    name: Build, testes e instalação Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CI: 'true'

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Testes de regras e SQL
        run: npm test

      - name: Gerar instalador EXE Windows
        shell: pwsh
        run: npm run build:win -- --x64

      - name: Validar instalação gerada e executar smoke isolado
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Join-Path $PWD "dist/FinControl-$version-setup.exe"
          $unpacked = Join-Path $PWD "dist/win-unpacked/fincontrol.exe"
          if (-not (Test-Path $installer)) { throw "Instalador nao criado: $installer" }
          if (-not (Test-Path $unpacked)) { throw "Aplicativo empacotado nao encontrado: $unpacked" }
          $bytes = (Get-Item $installer).Length
          if ($bytes -lt 10485760) { throw "Instalador inesperadamente pequeno: $bytes bytes" }
          Write-Host "Instalador: $installer ($bytes bytes)"
          $p = Start-Process -FilePath $unpacked -ArgumentList "--fincontrol-smoke-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Smoke do executavel empacotado falhou: $($p.ExitCode)" }

      - name: Instalar EXE silenciosamente e validar executável instalado
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Join-Path $PWD "dist/FinControl-$version-setup.exe"
          $diretorio = Join-Path $env:RUNNER_TEMP "FinControl-Instalado"
          $instalacao = Start-Process -FilePath $installer -ArgumentList "/S /D=$diretorio" -Wait -PassThru
          if ($instalacao.ExitCode -ne 0) { throw "Instalacao NSIS falhou com codigo $($instalacao.ExitCode)" }
          $exe = Join-Path $diretorio "fincontrol.exe"
          if (-not (Test-Path $exe)) { throw "O instalador nao produziu $exe" }
          $teste = Start-Process -FilePath $exe -ArgumentList "--fincontrol-smoke-test" -PassThru -Wait
          if ($teste.ExitCode -ne 0) { throw "Smoke do aplicativo instalado falhou: $($teste.ExitCode)" }
          Write-Host "Instalacao + execucao isolada OK"

      - name: Registrar checksum SHA-256
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Join-Path $PWD "dist/FinControl-$version-setup.exe"
          $hash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  FinControl-$version-setup.exe" |
            Out-File -FilePath "dist/SHA256SUMS.txt" -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Disponibilizar instalador para download
        uses: actions/upload-artifact@v4
        with:
          name: FinControl-1.0.0-Windows-x64
          path: |
            dist/FinControl-1.0.0-setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
