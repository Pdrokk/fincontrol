name: FinControl 1.0 - Windows portátil
on:
  push:
    branches:
      - 'portable/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-portable:
    name: Testar e gerar executável único Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CI: 'true'

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Verificar ESLint
        run: npm run lint

      - name: Testar regras e SQL
        run: npm test

      - name: Gerar FinControl portátil
        shell: pwsh
        run: npm run build:win -- --x64

      - name: Verificar executável empacotado com banco isolado
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $unpacked = Join-Path $PWD "dist/win-unpacked/fincontrol.exe"
          if (-not (Test-Path $unpacked)) { throw "EXE empacotado não encontrado: $unpacked" }
          $teste = Start-Process -FilePath $unpacked -ArgumentList "--fincontrol-smoke-test" -PassThru -Wait
          if ($teste.ExitCode -ne 0) { throw "Teste financeiro do EXE empacotado falhou: $($teste.ExitCode)" }
          $testeUI = Start-Process -FilePath $unpacked -ArgumentList "--fincontrol-ui-smoke-test" -PassThru -Wait
          if ($testeUI.ExitCode -ne 0) { throw "Teste React do EXE empacotado falhou: $($testeUI.ExitCode)" }

      - name: Executar o portátil real sem instalar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $portatil = Join-Path $PWD "dist/FinControl-$version-portable.exe"
          if (-not (Test-Path $portatil)) { throw "EXE portátil não gerado: $portatil" }
          $bytes = (Get-Item $portatil).Length
          if ($bytes -lt 10485760) { throw "EXE portátil inesperadamente pequeno: $bytes bytes" }
          Write-Host "Portátil gerado: $portatil ($bytes bytes)"

          $teste = Start-Process -FilePath $portatil -ArgumentList "--fincontrol-smoke-test" -PassThru -Wait
          if ($teste.ExitCode -ne 0) { throw "Teste financeiro do portátil falhou: $($teste.ExitCode)" }
          $testeUI = Start-Process -FilePath $portatil -ArgumentList "--fincontrol-ui-smoke-test" -PassThru -Wait
          if ($testeUI.ExitCode -ne 0) { throw "Navegação React do portátil falhou: $($testeUI.ExitCode)" }
          Write-Host "EXE portátil executado sem instalação. Testes SQLite, migração, backup, estornos e navegação OK."

      - name: Registrar checksum SHA-256
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $portatil = Join-Path $PWD "dist/FinControl-$version-portable.exe"
          $hash = (Get-FileHash -Path $portatil -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  FinControl-$version-portable.exe" |
            Out-File -FilePath "dist/SHA256SUMS.txt" -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Disponibilizar executável portátil
        uses: actions/upload-artifact@v4
        with:
          name: FinControl-1.0.0-Portatil-Windows-x64
          path: |
            dist/FinControl-1.0.0-portable.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
