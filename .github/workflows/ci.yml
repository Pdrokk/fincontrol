name: FinControl - verificações de qualidade
on:
  push:
    branches: [master, 'feature/**']
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
      - name: Verificar lint
        run: npm run lint
      - name: Executar testes isolados
        run: npm test
      - name: Compilar aplicativo
        run: npm run build
