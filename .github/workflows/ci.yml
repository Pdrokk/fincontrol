name: FinControl - verificações de qualidade
on:
  push:
    branches: [master, 'feature/**']
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
      - name: Verificar lint
        run: npm run lint
      - name: Executar testes isolados
        run: npm test
      - name: Medir cobertura dos testes isolados
        shell: bash
        run: |
          set -o pipefail
          npm run test:coverage | tee cobertura-testes.txt
      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FinControl-Cobertura-Testes
          path: cobertura-testes.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Compilar aplicativo
        run: npm run build
