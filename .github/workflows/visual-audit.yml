name: Auditoria visual FinControl 1.0
on:
  push:
    branches: ['audit/visual-bugs-v1-2026-11']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    name: Capturar telas reais no Windows
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      FINCONTROL_SCREENSHOT_DIR: audit/screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Tipos e regras
        run: |
          npm run typecheck
          npm test
      - name: Gerar aplicativo sem instalador
        shell: pwsh
        run: |
          npm run build
          node scripts/gerar-icones.mjs
          npx electron-builder --win --dir --publish never
      - name: Capturar dez telas da interface real
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'dist/win-unpacked/fincontrol.exe'
          if (-not (Test-Path $exe)) { throw "EXE não encontrado: $exe" }
          $p = Start-Process -FilePath $exe -ArgumentList '--fincontrol-visual-audit' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Auditoria visual falhou: $($p.ExitCode)" }
          $screenshots = @(Get-ChildItem audit/screenshots -Filter *.png)
          if ($screenshots.Count -ne 10) { throw "Esperadas 10 imagens, encontradas $($screenshots.Count)" }
          Get-Content audit/screenshots/metricas.json
      - name: Disponibilizar imagens reais e métricas
        uses: actions/upload-artifact@v4
        with:
          name: FinControl-prints-auditoria-v1
          path: audit/screenshots/
          if-no-files-found: error
          retention-days: 30
